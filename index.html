<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Training</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Mein Training</h1>
    <form id="eintrag-formular">
      <label for="uebung">Übung</label>
      <input id="uebung" type="text" required placeholder="z. B. Kniebeugen">
      <label for="gewicht">Gewicht (kg)</label>
      <input id="gewicht" type="number" step="0.5" min="0" required placeholder="z. B. 60">
      <label for="datum">Datum</label>
      <input id="datum" type="date" required>
      <button type="submit">Speichern</button>
    </form>
    <h2>Meine Einträge</h2>
    <ul id="liste"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
